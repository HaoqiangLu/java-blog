# [K8s] Kafka ClusterIP Service — 集群内服务发现
# 与 Docker Compose 对比：相当于 networks: blog-network 中的 kafka 服务
apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  namespace: blog-platform
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: kafka
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: controller
  selector:
    app.kubernetes.io/name: kafka