# [K8s] Kafka Deployment — KRaft 模式（无需 ZooKeeper），单副本
# 与 Docker Compose 对比：相当于 kafka service + 12 个环境变量 + healthcheck
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: blog-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: blog-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: apache/kafka:latest
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller

          # [K8s] KRaft 模式环境变量 — 对应 Docker Compose 中的 12 个 KAFKA_* 变量
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-svc:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          # [K8s] 启动探针 — Kafka KRaft 模式初始化慢（格式化存储+选举），给足时间
          # 用 TCP 端口检查而非 kafka-broker-api-versions.sh（Java 命令每次启动 JVM 太慢）
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30  # 最多等 30×5=150 秒

          # [K8s] 存活探针 — 对应 Docker Compose healthcheck
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60  # startupProbe 通过后才开始，给额外缓冲
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

          volumeMounts:
            - name: kafka-storage
              mountPath: /tmp/kraft-combined-logs

      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc